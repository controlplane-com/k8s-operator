image: ghcr.io/controlplane-com/cpln-build/cpln-operator:v0.5.1
env:
  CPLN_API_URL: https://api.cpln.io
  CPLN_WORKLOAD_STATUS_URL: wss://workload-status.cpln.io/register
  WEBHOOK_PORT: 9443
  CONTROLLER_ENABLED: true
  RECONCILE_INTERVAL_SECONDS: 30
  TLS_CERT_DIR: /cert
  TLS_CERT_NAME: tls.crt
  TLS_KEY_NAME: tls.key

  #Set this to restrict the operator to the given kinds. By default, the operator manages all available custom resource kinds
  #MANAGE_KINDS: workload,volumeset

  #Set to pull-only to stop the operator from writing to Control Plane. Control Plane becomes the source of truth: changes
  #are pulled into the custom resources, edits to the custom resources are never pushed, and deleting a custom resource
  #never deletes the Control Plane resource. Defaults to bidirectional.
  #SYNC_MODE: pull-only